<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b22222">
<title>WDT Site Survey</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --brand: #b22222; --brand-ink: #fff; --brand-soft: #fbe9e9;
  --bg: #f4f2ef; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #dcd8d2;
  --ok: #217a3c; --ok-soft: #e4f3e8; --warn: #9a5b00; --warn-soft: #fff3dc;
  --input: #ffffff; --shadow: 0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --brand: #d9423c; --brand-soft: #3a1c1b;
    --bg: #121214; --card: #1e1e21; --ink: #f2f2f2; --muted: #a2a2a8; --line: #34343a;
    --ok: #5fc27a; --ok-soft: #173322; --warn: #f0b154; --warn-soft: #3a2a10;
    --input: #26262a; --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
header.top { position: sticky; top: 0; z-index: 5; background: var(--brand); color: var(--brand-ink);
  padding: calc(env(safe-area-inset-top) + 10px) 12px 10px; display: flex; align-items: center; gap: 8px; }
header.top h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.top button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-size: 15px; }
nav.tabs { position: sticky; top: calc(env(safe-area-inset-top) + 52px); z-index: 4; display: flex; gap: 6px; overflow-x: auto;
  background: var(--card); border-bottom: 1px solid var(--line); padding: 8px 10px; scrollbar-width: none; }
nav.tabs a { flex: none; padding: 8px 12px; border-radius: 999px; text-decoration: none; color: var(--ink);
  background: var(--bg); font-size: 15px; white-space: nowrap; }
nav.tabs a.on { background: var(--brand); color: #fff; }
nav.tabs .n { font-size: 12px; opacity: .8; margin-left: 4px; }
main { padding: 12px 12px calc(env(safe-area-inset-bottom) + 90px); max-width: 760px; margin: 0 auto; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card h2 { font-size: 17px; margin: 0 0 4px; }
.card h3 { font-size: 15px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.std { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
label.f { display: block; margin: 12px 0 0; font-weight: 600; font-size: 15px; }
label.f .hint { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
input[type=text], input[type=tel], input[type=email], input[type=date], input[type=number], textarea, select {
  width: 100%; margin-top: 6px; padding: 12px; font: inherit; font-size: 16px; color: var(--ink);
  background: var(--input); border: 1px solid var(--line); border-radius: 10px; }
textarea { min-height: 84px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 0; }
.seg { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.seg button { flex: 1 1 0; min-width: 64px; padding: 11px 8px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--input); color: var(--ink); font: inherit; font-size: 15px; }
.seg button.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; text-decoration: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.danger { color: var(--brand); }
.btn.block { width: 100%; margin-top: 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1 1 140px; }
.fab { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); z-index: 6;
  background: var(--brand); color: #fff; border: 0; border-radius: 999px; padding: 15px 22px; font: inherit; font-weight: 700;
  box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.list a.item { display: block; text-decoration: none; color: inherit; }
.item .t { font-weight: 700; }
.item .s { color: var(--muted); font-size: 14px; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted); margin: 4px 4px 0 0; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.chip { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; background: var(--input); overflow: hidden; }
.chip button { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 15px; padding: 9px 12px; }
.chip .c { min-width: 26px; text-align: center; font-weight: 700; }
.chip.has { border-color: var(--brand); background: var(--brand-soft); }
.chip .minus { color: var(--muted); padding-right: 4px; }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg); border: 1px solid var(--line); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 3px 5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.sys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.sys button { padding: 14px 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--input); color: var(--ink); font: inherit; font-weight: 600; }
.sys button.on { border-color: var(--brand); background: var(--brand-soft); }
.progress { height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.progress > i { display: block; height: 100%; background: var(--ok); }
dialog { border: 0; border-radius: 16px; padding: 0; width: min(94vw, 560px); background: var(--card); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.55); }
dialog .in { padding: 14px; }
dialog img { width: 100%; max-height: 55vh; object-fit: contain; background: #000; display: block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 84px); z-index: 20;
  background: #222; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
pre.preview { white-space: pre-wrap; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; background: var(--bg); padding: 10px; border-radius: 10px; max-height: 50vh; overflow: auto; }
.var { border-left: 4px solid var(--warn); padding-left: 10px; margin-top: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" multiple hidden>
<input type="file" id="restoreIn" accept=".json,application/json" hidden>
<script src="app.js"></script>
</body>
</html>
